services:
  app:
    build: .
    # The image's default CMD is docker/render/entrypoint.sh (Render-only: creates/migrates a local
    # SQLite file, then supervisord). Dev compose has its own DB (below) and no supervisor config
    # beyond the nginx+php-fpm fragment the Dockerfile writes, so run those two directly instead.
    command: sh -c "php-fpm -D && nginx -g 'daemon off;'"
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      # Off: the app is also public through the Cloudflare quick tunnel, where error pages must not show details.
      APP_DEBUG: "false"
      APP_URL: http://192.168.0.100:8000
      # Not persisted anywhere else (the container's own filesystem is thrown away on every recreate),
      # so it must come from here or sessions/cookies/encrypted data break on every restart. Set in .env.
      APP_KEY: ${APP_KEY}
      # false: ARASAAC pictograms (CC BY-NC-SA, non-commercial only) are replaced everywhere by their
      # substitute (database/lexicon/substitutes.json: a Mulberry symbol, our own AI picture, or plain
      # emoji). Default true (pictograms on) for local/dev convenience; set false in .env to go live with it.
      BESZED_PICTOGRAMS: ${BESZED_PICTOGRAMS:-true}
      LOG_CHANNEL: stderr
      # MySQL on the shared dev server (horizon-mysql, on the global-network), in its own database with
      # its own user that can touch nothing else there. Fixed here on purpose: .env's DB_* are for the
      # host side (localhost:10000), which inside the container would point at the container itself.
      DB_CONNECTION: mysql
      DB_HOST: horizon-mysql
      DB_PORT: 3306
      DB_DATABASE: beszed
      DB_USERNAME: beszed
      DB_PASSWORD: beszed
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: local
      # *.trycloudflare.com: the free Cloudflare quick tunnel (its address changes on every restart)
      SANCTUM_STATEFUL_DOMAINS: localhost,localhost:8000,127.0.0.1,127.0.0.1:8000,::1,192.168.0.100:8000,*.trycloudflare.com
      TTS_DRIVER: ${TTS_DRIVER:-piper}
      # Mondd utánam: null | whisper (own server, see the whisper service below) | azure
      STT_DRIVER: ${STT_DRIVER:-null}
      WHISPER_URL: ${WHISPER_URL:-http://whisper:8000}
      WHISPER_MODEL: ${WHISPER_MODEL:-Systran/faster-whisper-large-v3}
      WHISPER_KEY: ${WHISPER_KEY:-}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-westeurope}
      AZURE_SPEECH_VOICE: ${AZURE_SPEECH_VOICE:-hu-HU-NoemiNeural}
      TTS_RATE: ${TTS_RATE:--10%}
      TTS_PITCH: ${TTS_PITCH:-+8%}
      # Parent sign-in with Google; leave empty to use the local demo sign-in only.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # E-mail (weekly reports, milestones). "log" writes them to the log; set smtp + the rest in .env to send.
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-csillam@example.test}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Csillám}
      # Content editor (/tartalom) access, comma-separated e-mails. Nobody by default: through the
      # tunnel anyone can sign in as the demo parent. Set ADMIN_EMAILS=parent@example.test in .env
      # to edit content again while the app is not public.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    volumes:
      - beszed-storage:/var/www/html/storage
      - ./resources:/var/www/html/resources:ro
    # default: the Cloudflare tunnel reaches the app as "app"; global-network: horizon-mysql
    networks:
      - default
      - global-network

  # Self-hosted speech recognition for "Mondd utánam": the child's voice never leaves this machine.
  # Off by default; start it with `docker compose --profile whisper up -d whisper`, then set
  # STT_DRIVER=whisper in .env. The first start downloads the model (~3 GB) into the hf-hub-cache volume.
  # large-v3 in int8_float16 needs about 4 GB of VRAM (a 6 GB card is enough). No GPU? Use the
  # ghcr.io/speaches-ai/speaches:latest-cpu image, drop the deploy block and set WHISPER_MODEL to a smaller
  # model (Systran/faster-whisper-medium), also in PRELOAD_MODELS below.
  whisper:
    image: ghcr.io/speaches-ai/speaches:latest-cuda
    profiles: ["whisper"]
    restart: unless-stopped
    environment:
      WHISPER__COMPUTE_TYPE: int8_float16
      # keep the model loaded: the first word of a game must not wait for it to load
      STT_MODEL_TTL: "-1"
      PRELOAD_MODELS: '["Systran/faster-whisper-large-v3"]'
      API_KEY: ${WHISPER_KEY:-}
    volumes:
      - hf-hub-cache:/home/ubuntu/.cache/huggingface/hub
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  beszed-storage:
  hf-hub-cache:

networks:
  global-network:
    external: true
