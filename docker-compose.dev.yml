version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beszed-app
    ports:
      - "8000:8000"
    environment:
      APP_NAME: Beszéd
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: beszed
      DB_USERNAME: root
      DB_PASSWORD: secret

      CACHE_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: null

      QUEUE_CONNECTION: redis
      SESSION_DRIVER: cookie
    volumes:
      - .:/app
      - /app/node_modules
      - /app/vendor
    depends_on:
      - db
      - redis
    networks:
      - beszed-network
    command: >
      sh -c "
        composer install &&
        npm install &&
        php artisan migrate --seed &&
        npm run dev &
        php artisan serve --host=0.0.0.0 --port=8000
      "

  db:
    image: mysql:8.0
    container_name: beszed-db
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: beszed
      MYSQL_USER: beszed
      MYSQL_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - beszed-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: beszed-redis
    ports:
      - "6379:6379"
    networks:
      - beszed-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: beszed-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public:/app/public:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - beszed-network

volumes:
  mysql_data:

networks:
  beszed-network:
    driver: bridge
