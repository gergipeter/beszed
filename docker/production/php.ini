; Production PHP settings for the Beszéd image.
expose_php = Off
memory_limit = 256M
; Parent voice recordings (config/beszed.php recordings.max_kb = 5 MB) + form overhead.
upload_max_filesize = 8M
post_max_size = 10M

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Code only changes with a new image.
opcache.validate_timestamps = 0
